name: マイグレーション

on:
  push:
    branches:
      - main

jobs:
  apply_migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable corepack (use pinned pnpm from package.json)
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fix migration history
        run: pnpm drizzle:fix-history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
      - name: Apply migrations
        run: pnpm drizzle:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
